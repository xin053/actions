name: capo-docker-image
on:
  workflow_dispatch:
    inputs:
      capo-version:
        description: "Capo version, such as v0.14.8"
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout capo repository
        uses: actions/checkout@v4
        with:
          repository: kubernetes-sigs/cluster-api-provider-openstack
          path: cluster-api-provider-openstack
          ref: ${{ github.event.inputs.capo-version }}

      - name: Change Delete to ForceDelete in OpenStack CAPO code
        run: |
          sed -i s#servers.Delete#servers.ForceDelete#g $GITHUB_WORKSPACE/cluster-api-provider-openstack/pkg/clients/compute.go

      # 1. 登录 Harboreme 私仓
      - name: Login to Harboreme Registry
        uses: docker/login-action@v3
        continue-on-error: true
        id: harbor-login
        with:
          registry: ${{ secrets.HARBOREME_REGISTRY }}
          username: ${{ secrets.HARBOREME_REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOREME_REGISTRY_PASSWORD }}

      # 2. 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        continue-on-error: true
        id: dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 3. 仅构建一次本地镜像
      - name: Build Capo Docker Image
        run: |
          cd $GITHUB_WORKSPACE/cluster-api-provider-openstack
          make docker-build
        env:
          CONTROLLER_IMG_TAG: capi-openstack-controller:${{ github.event.inputs.capo-version }}-mye

      # 4. 推送到 Harboreme（失败不影响后续步骤）
      - name: Push to Harboreme Registry
        id: push-harbor
        continue-on-error: true
        run: |
          LOCAL_IMG="capi-openstack-controller:${{ github.event.inputs.capo-version }}-mye"
          TARGET_IMG="${{ secrets.HARBOREME_REGISTRY }}/kubespray/registry.k8s.io/capi-openstack/capi-openstack-controller:${{ github.event.inputs.capo-version }}-mye"

          docker tag "$LOCAL_IMG" "$TARGET_IMG"
          docker push "$TARGET_IMG"

      # 5. 推送到 Docker Hub（Harbor 失败也会继续执行）
      - name: Push to Docker Hub
        id: push-dockerhub
        continue-on-error: true
        run: |
          LOCAL_IMG="capi-openstack-controller:${{ github.event.inputs.capo-version }}-mye"
          TARGET_IMG="xin053/capi-openstack-controller:${{ github.event.inputs.capo-version }}-mye"

          docker tag "$LOCAL_IMG" "$TARGET_IMG"
          docker push "$TARGET_IMG"

      # 6. 最终状态检查：确保至少有一个推送成功；若有失败则打印提示并使 Workflow 标记异常
      - name: Verify Push Status
        run: |
          HARBOR_STATUS="${{ steps.push-harbor.outcome }}"
          DOCKERHUB_STATUS="${{ steps.push-dockerhub.outcome }}"

          echo "Harbor Push Status: $HARBOR_STATUS"
          echo "Docker Hub Push Status: $DOCKERHUB_STATUS"

          if [ "$HARBOR_STATUS" != "success" ] || [ "$DOCKERHUB_STATUS" != "success" ]; then
            echo "::warning::部分仓库推送未成功！请检查上方具体步骤的日志。"
            # 如果希望只要有任意一个仓库推送失败就让整个 Action 标红，取消下一行的注释即可：
            # exit 1
          fi
